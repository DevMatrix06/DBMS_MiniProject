services:
  db:
    image: pgvector/pgvector:pg16
    container_name: devmatch-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devmatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-devmatch}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Only these run on FIRST start, in order. 05_queries.sql and 06_alter_demo.sql are manual
      # demo scripts (06 fails on an empty database), so they must not be mounted here.
      - ./db/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./db/02_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
      - ./db/03_logic.sql:/docker-entrypoint-initdb.d/03_logic.sql:ro
      - ./db/04_views.sql:/docker-entrypoint-initdb.d/04_views.sql:ro
      - ./db/07_application_rules.sql:/docker-entrypoint-initdb.d/07_application_rules.sql:ro
      - ./db/08_close_issue_rule.sql:/docker-entrypoint-initdb.d/08_close_issue_rule.sql:ro
      - ./db/09_hybrid_search.sql:/docker-entrypoint-initdb.d/09_hybrid_search.sql:ro
      - ./db/10_login_attempts.sql:/docker-entrypoint-initdb.d/10_login_attempts.sql:ro
      - ./db/11_filter_indexes.sql:/docker-entrypoint-initdb.d/11_filter_indexes.sql:ro

volumes:
  pgdata:
